name: Build WinFlux OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Lega-kan ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Build ISO
        run: |
          chmod +x build_winflux.sh
          sudo ./build_winflux.sh

      - name: Unggah ISO
        uses: actions/upload-artifact@v4
        with:
          name: winflux-os-iso
          path: |
            winflux-os-*.iso
            winflux-os-*.iso.sha256
          compression-level: 0
          retention-days: 14
